<div class="container">
  <h2>Vehicle Categories</h2>

  <table class="vehicle-categories-table">
    <thead>
      <tr>
        <th>Category Name</th>
        <th>Description</th>
        <th>Icon</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let category of vehicleCategories; let i = index">
        <td>{{ category.name }}</td>
        <td>{{ category.description }}</td>
        <td>
          <img
            *ngIf="category.icon"
            [src]="category.icon"
            alt="Icon"
            class="category-icon"
          />
        </td>
        <td>
          <button (click)="editCategory(category)">Edit</button>
          <button (click)="deleteCategory(category.id!)">Delete</button>
        </td>
      </tr>
    </tbody>
  </table>

  
  <div class="add-category-form">
    <h3>{{ editMode ? 'Edit Category' : 'Add New Category' }}</h3>
    <form (ngSubmit)="saveButton()" (dragover)="onDragOver($event)" (drop)="onDrop($event)">
      <label for="categoryName">Category Name:</label>
      <input
        type="text"
        id="categoryName"
        [(ngModel)]="newCategory.name"
        name="categoryName"
        required
      />

      <label for="categoryDescription">Category Description:</label>
      <input
        type="text"
        id="categoryDescription"
        [(ngModel)]="newCategory.description"
        name="categoryDescription"
        required
      />

      <label>Category Icon:</label>
      <!-- Image Preview -->
      <div *ngIf="newCategory.icon" class="image-preview">
      <img
        [src]="newCategory.icon.startsWith('data:image/') ? newCategory.icon : 'data:image/png;base64,' + newCategory.icon"
        alt="Preview"
      />
      </div>

      <!-- Drag-and-Drop Area -->
      <div
      class="drag-drop-area"
      (dragover)="onDragOver($event)"
      (dragleave)="onDragLeave($event)"
      (drop)="onDrop($event)"
      (click)="fileInput.click()"
      >
      <p>Drag and drop an image here or click to browse and choose.</p>
      </div>

      <!-- Hidden File Input -->
      <input
      type="file"
      accept="image/*"
      style="display: none"
      #fileInput
      (change)="onIconChange($event)"
      />


      <button type="submit">{{ editMode ? 'Update Category' : 'Save Category' }}</button>
      <button type="button" (click)="resetForm()" class="btn btn-secondary" style="margin-left: 5%;">Reset</button>

    </form>
  </div>
</div>

<div class="container d-flex align-items-center">
  <button type="button" class="btn btn-primary btn-sm" routerLink="/admin/dashboard">Back</button>
</div>
