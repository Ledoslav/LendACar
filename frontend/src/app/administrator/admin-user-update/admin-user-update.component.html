<div class="container mt-4">
  <h2 class="text-center mb-2">User Update</h2>
  <form [formGroup]="userEditForm">

    <div class="form-group mb-2">
      <label for="firstName">First Name</label>
      <input type="text" id="firstName" class="form-control" formControlName="firstName" />
      <mat-error *ngIf="userEditForm.get('firstName')?.invalid && userEditForm.get('firstName')?.touched" style="color: red">
        First name required
      </mat-error>
    </div>

    <div class="form-group mb-2">
      <label for="lastName">Last Name</label>
      <input type="text" id="lastName" class="form-control" formControlName="lastName"  />
      <mat-error *ngIf="userEditForm.get('lastName')?.invalid && userEditForm.get('lastName')?.touched" style="color: red">
        Last name required
      </mat-error>
    </div>

    <div class="form-group mb-2">
      <label for="email">Email</label>
      <input type="email" id="email" class="form-control" formControlName="emailAddress" />
      <mat-error *ngIf="userEditForm.get('emailAddress')?.invalid && userEditForm.get('emailAddress')?.touched" style="color: red">
        Email required
      </mat-error>
    </div>
    <div class="form-group mb-2">
      <label for="username">Username</label>
      <input type="text" id="username" class="form-control" formControlName="username" />
      <mat-error *ngIf="userEditForm.get('username')?.invalid && userEditForm.get('username')?.touched" style="color: red">
        Username required
      </mat-error>
    </div>

    <div class="form-group mb-2">
      <label for="phone">Phone</label>
      <input type="text" id="phone" class="form-control" formControlName="phoneNumber" />
      <mat-error *ngIf="userEditForm.get('phoneNumber')?.invalid && userEditForm.get('phoneNumber')?.touched" style="color: red">
        Phone number required
      </mat-error>
    </div>

    <div class="form-group mb-2">
      <label for="birthDate">Birth Date</label>
      <input type="date"  id="birthDate" class="form-control" formControlName="birthDate"/>
      <mat-error *ngIf="userEditForm.get('birthDate')?.invalid && userEditForm.get('birthDate')?.touched" style="color: red">
        Birth date required
      </mat-error>
    </div>

    <div class="form-group mb-2">
      <label for="country">Country</label>
      <select  class="form-select" (change)="FilterCities($event,undefined)" aria-label="Default select example" formControlName="countryId" >
        <option *ngFor="let country of countries"   id="country" value="{{country.id}}">{{country.name}}</option>
      </select>
      <mat-error *ngIf="userEditForm.get('countryId')?.invalid && userEditForm.get('countryId')?.touched" style="color: red">
        Country required
      </mat-error>
    </div>

    <div class="form-group mb-2">
      <label for="city">City</label>
      <select  class="form-select" aria-label="Default select example" formControlName="cityId" >
          <option *ngFor="let city of filteredCities"  id="city" value="{{city.id}}">{{city.name}}</option>
      </select>
      <mat-error *ngIf="userEditForm.get('cityId')?.invalid && userEditForm.get('cityId')?.touched" style="color: red">
        City required
      </mat-error>
    </div>

    <div class="form-group mb-2">
      <label for="isVerified">Verified</label>
      <input type="checkbox" id="isVerified" formControlName="isVerified" />
      <input type="hidden" formControlName="isUserVerifiedStatusChanged" />
    </div>

    <button type="button" class="btn btn-primary w-100" [disabled]="this.userEditForm.invalid"   (click)="UpdateUser()">Update</button>

  </form>
</div>
