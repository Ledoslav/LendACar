<div class="container mt-4">
  <h2 class="text-center mb-2">User Update</h2>
  <form [formGroup]="userEditForm">

    <div class="form-group mb-2">
      <label for="firstName">First Name</label>
      <input type="text" id="firstName" class="form-control" formControlName="firstName" />
    </div>

    <div class="form-group mb-2">
      <label for="lastName">Last Name</label>
      <input type="text" id="lastName" class="form-control" formControlName="lastName"  />
    </div>

    <div class="form-group mb-2">
      <label for="email">Email</label>
      <input type="email" id="email" class="form-control" formControlName="emailAddress" />
    </div>
    <div class="form-group mb-2">
      <label for="username">Username</label>
      <input type="text" id="username" class="form-control" formControlName="username" />
    </div>

    <div class="form-group mb-2">
      <label for="phone">Phone</label>
      <input type="text" id="phone" class="form-control" formControlName="phoneNumber" />
    </div>

    <div class="form-group mb-2">
      <label for="birthDate">Birth Date</label>
      <input type="date"  id="birthDate" class="form-control" formControlName="birthDate"/>
    </div>

    <div class="form-group mb-2">
      <label for="country">Country</label>
      <select  class="form-select" (change)="FilterCities($event,undefined)" aria-label="Default select example" formControlName="countryId" >
        <option *ngFor="let country of countries"   id="country" value="{{country.id}}">{{country.name}}</option>
      </select>
    </div>

    <div class="form-group mb-2">
      <label for="city">City</label>
      <select  class="form-select" aria-label="Default select example" formControlName="cityId" >
          <option *ngFor="let city of filteredCities"  id="city" value="{{city.id}}">{{city.name}}</option>
      </select>
    </div>

    <div class="form-group mb-2">
      <label for="verified">Verified</label>
      <input type="checkbox" class="mx-2" id="verified" formControlName="isVerified" />
    </div>

    <button type="button" class="btn btn-primary w-100"  *ngIf="!this.userEditForm.invalid" (click)="UpdateUser()">Update</button>

  </form>
</div>
