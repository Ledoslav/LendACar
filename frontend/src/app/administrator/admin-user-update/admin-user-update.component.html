<div style="max-width: 600px; margin: 32px auto;">
  <h2 class="text-center mb-2">User Update</h2>
  <form [formGroup]="userEditForm">
    <mat-form-field appearance="outline" class="w-100 mb-2">
      <mat-label>First Name</mat-label>
      <input matInput id="firstName" formControlName="firstName" />
      <mat-error *ngIf="userEditForm.get('firstName')?.invalid && userEditForm.get('firstName')?.touched">
        First name required
      </mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" class="w-100 mb-2">
      <mat-label>Last Name</mat-label>
      <input matInput id="lastName" formControlName="lastName" />
      <mat-error *ngIf="userEditForm.get('lastName')?.invalid && userEditForm.get('lastName')?.touched">
        Last name required
      </mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" class="w-100 mb-2">
      <mat-label>Email</mat-label>
      <input matInput type="email" id="email" formControlName="emailAddress" />
      <mat-error *ngIf="userEditForm.get('emailAddress')?.invalid && userEditForm.get('emailAddress')?.touched">
        Email required
      </mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" class="w-100 mb-2">
      <mat-label>Username</mat-label>
      <input matInput id="username" formControlName="username" />
      <mat-error *ngIf="userEditForm.get('username')?.invalid && userEditForm.get('username')?.touched">
        Username required
      </mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" class="w-100 mb-2">
      <mat-label>Phone</mat-label>
      <input matInput id="phone" formControlName="phoneNumber" />
      <mat-error *ngIf="userEditForm.get('phoneNumber')?.invalid && userEditForm.get('phoneNumber')?.touched">
        Phone number required
      </mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" class="w-100 mb-2">
      <mat-label>Birth Date</mat-label>
      <input matInput [matDatepicker]="birthDatePicker" id="birthDate" formControlName="birthDate" />
      <mat-datepicker-toggle matSuffix [for]="birthDatePicker"></mat-datepicker-toggle>
      <mat-datepicker #birthDatePicker></mat-datepicker>
      <mat-error *ngIf="userEditForm.get('birthDate')?.invalid && userEditForm.get('birthDate')?.touched">
        Birth date required
      </mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" class="w-100 mb-2">
      <mat-label>Country</mat-label>
      <mat-select formControlName="countryId" (selectionChange)="FilterCities($event,undefined)">
        <mat-option *ngFor="let country of countries" [value]="country.id">{{country.name}}</mat-option>
      </mat-select>
      <mat-error *ngIf="userEditForm.get('countryId')?.invalid && userEditForm.get('countryId')?.touched">
        Country required
      </mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" class="w-100 mb-2">
      <mat-label>City</mat-label>
      <mat-select formControlName="cityId">
        <mat-option *ngFor="let city of filteredCities" [value]="city.id">{{city.name}}</mat-option>
      </mat-select>
      <mat-error *ngIf="userEditForm.get('cityId')?.invalid && userEditForm.get('cityId')?.touched">
        City required
      </mat-error>
    </mat-form-field>

    <div class="form-group mb-2">
      <label for="isVerified">Verified</label>
      <input type="checkbox" id="isVerified" formControlName="isVerified" />
      <input type="hidden" formControlName="isUserVerifiedStatusChanged" />
    </div>

    <button type="button" class="btn btn-primary w-100" [disabled]="this.userEditForm.invalid"   (click)="UpdateUser()">Update</button>

  </form>
</div>
