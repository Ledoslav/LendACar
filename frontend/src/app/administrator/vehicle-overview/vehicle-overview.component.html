<body>
<ng-container *ngIf="formIsClosed && updateFormIsClosed">
<section>
    <h2 class="text-center m-3">Vehicle Information</h2>
    <div class="bg-image h-100" >
      <div class="mask d-flex align-items-center h-100">
        <div class="container">
          <div class="row justify-content-center">
            <div class="search-bar-container mb-3">
              <input
                type="text"
                class="form-control"
                placeholder="Search by Brand or Model"
                (input)="onSearch($event)"
              />
            </div>
            <div class="col-12">
              <!--            <div class="container my-2">
                            <input type="text" placeholder="Search employee" id="empSearch" style="width: 20%">
                            <button class="btn btn-default btn-outline-light mx-3">Search</button>
                          </div>-->
              <div class="filter-container">
                <!-- Filter by Brand -->
                <select [(ngModel)]="filter.brandName" (ngModelChange)="onBrandChange()">
                  <option value="">All Brands</option>
                  <option *ngFor="let brand of uniqueBrands" [value]="brand">{{ brand }}</option>
                </select>

                <!-- Filter by Vehicle ID -->
                <input
                  type="number"
                  [(ngModel)]="filter.vehicleId"
                  placeholder="Filter by Vehicle ID"
                  (ngModelChange)="applyFilters()"
                />

                <!-- Dropdown for Model selection -->
                <select [(ngModel)]="filter.modelName" (ngModelChange)="applyFilters()">
                  <option value="">All Models</option>
                  <option *ngFor="let model of filteredModels" [value]="model">{{ model }}</option>
                </select>

                <!-- Checkbox for "Has Image" filter -->
                <label>
                  <input type="checkbox" [(ngModel)]="filter.hasImage" (ngModelChange)="applyFilters()" />
                  Has Image
                </label>
              </div>

              <div class="card">
                <div class="card-body p-0">
                  <div class="table-responsive table-scroll" style="position: relative">
                    <table mat-table [dataSource]="dataSource" class="mat-elevation-z8 table table-striped mb-0">

                      <!-- No. Column -->
                      <ng-container matColumnDef="No.">
                        <th mat-header-cell *matHeaderCellDef>No.</th>
                        <td mat-cell *matCellDef="let element; let i = index">{{ i + 1 }}</td>
                      </ng-container>

                      <!-- Id Column -->
                      <ng-container matColumnDef="Id">
                        <th mat-header-cell *matHeaderCellDef>Id</th>
                        <td mat-cell *matCellDef="let element">{{ element.id }}</td>
                      </ng-container>

                      <!-- ModelName Column -->
                      <ng-container matColumnDef="ModelName">
                        <th mat-header-cell *matHeaderCellDef>ModelName</th>
                        <td mat-cell *matCellDef="let element">{{ element.modelName }}</td>
                      </ng-container>

                      <!-- BrandName Column -->
                      <ng-container matColumnDef="BrandName">
                        <th mat-header-cell *matHeaderCellDef>BrandName</th>
                        <td mat-cell *matCellDef="let element">{{ element.vehicleBrand.brandName }}</td>
                      </ng-container>

                      <!-- Icon Column -->
                      <ng-container matColumnDef="Icon">
                        <th mat-header-cell *matHeaderCellDef>Icon</th>
                        <td mat-cell *matCellDef="let element">
                          <img
                            *ngIf="element.vehicleBrand?.icon"
                            [src]="'data:image/png;base64,' + element.vehicleBrand.icon"
                            alt="{{ element.vehicleBrand.brandName }} Icon"
                            style="width: 50px; height: 50px; object-fit: cover;"
                          />
                        </td>
                      </ng-container>


                      <!-- Actions Column -->
                      <ng-container matColumnDef="Actions">
                        <th mat-header-cell *matHeaderCellDef>Actions</th>
                        <td mat-cell *matCellDef="let element">
                          <button class="btn btn-warning m-2 p-1" style="width: 100px" (click)="editVehicle(element)">Update</button>
                          <button class="btn btn-danger m-2 p-1" style="width: 100px" (click)="deleteVehicle(element.id)">Delete</button>
                          <button class="btn btn-danger m-2 p-1" style="width: 150px" (click)="deleteBrand(element.vehicleBrand.id,element.vehicleBrand.brandName)">Delete Brand</button>
                        </td>
                      </ng-container>

                      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
                    </table>
                  </div>
                </div>
              </div>

              <mat-paginator [pageSize]="10" [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons></mat-paginator>

            </div>
          </div>
        </div>
      </div>
    </div>
  </section>
</ng-container>

<ng-container *ngIf="!formIsClosed">
  <div class="container w-25 mt-3 mb-3">
    <form (ngSubmit)="submitVehicleForm()">
      <!-- Vehicle Model Name Field -->
      <div class="form-group mb-3">
        <label for="vehicleModelName">Vehicle model name</label>
        <input
          type="text"
          class="form-control"
          id="vehicleModelName"
          [(ngModel)]="formVehicle.modelName"
          name="vehicleModelName"
          required
        />
      </div>

      <div class="form-group mb-3">
        <label for="vehicleBrandName">Vehicle brand name</label>
        <input
          type="text"
          class="form-control"
          id="vehicleBrandName"
          [(ngModel)]="formVehicle.vehicleBrandName"
          name="vehicleBrandName"
          required
        />
      </div>

      <div class="form-group mb-3">
        <label for="vehicleIcon">Vehicle Icon</label>

        <!-- Image Preview -->
        <div *ngIf="formVehicle.icon" class="image-preview mb-2">
          <img
            [src]="formVehicle.icon"
            alt="Vehicle Icon Preview"
            style="max-width: 100%; max-height: 150px;"
          />
        </div>

        <!-- Drag-and-Drop Area -->
        <div
          class="drag-drop-area"
          (dragover)="onDragOver($event)"
          (dragleave)="onDragLeave($event)"
          (drop)="onDrop($event, 'formVehicle')"
          (click)="fileInput.click()"
          style="border: 2px dashed #ccc; padding: 20px; text-align: center; cursor: pointer;"
        >
          <p>Drag and drop an image here or click to browse and choose.</p>
        </div>

        <!-- Hidden File Input -->
        <input
          type="file"
          accept="image/*"
          style="display: none"
          #fileInput
          (change)="onIconChange($event, 'formVehicle')"
        />
      </div>

      <!-- Submit and Cancel Buttons -->
      <div class="d-flex justify-content-between mt-4">
        <button type="submit" class="btn btn-primary buttonForm w-25">Submit</button>
        <button type="button" (click)="cancelAddForm()" class="btn btn-danger buttonForm w-25">Cancel</button>
      </div>
    </form>
  </div>
</ng-container>

<ng-container *ngIf="!updateFormIsClosed">
  <div class="container w-25 mt-3 mb-3">
    <form (ngSubmit)="submitUpdateForm()">
      <!-- Vehicle Model Name Field -->
      <div class="form-group mb-3">
        <label for="updateModelName">Updating this vehicle model</label>
        <input
          type="text"
          class="form-control text-secondary"
          id="updateModelName"
          [(ngModel)]="updateFormVehicle.updateModelName"
          name="updateModelName"
          required
          readonly
        />
      </div>

      <div class="form-group mb-3">
        <label for="newModelName">to this new vehicle model</label>
        <input
          type="text"
          class="form-control"
          id="newModelName"
          [(ngModel)]="updateFormVehicle.newModelName"
          name="newModelName"
          required
        />
      </div>

      <div class="form-group mb-3">
        <label for="updateBrandName">Updating this vehicle brand</label>
        <input
          type="text"
          class="form-control text-secondary"
          id="updateBrandName"
          [(ngModel)]="updateFormVehicle.updateBrandName"
          name="updateBrandName"
          required
          readonly
        />
      </div>

      <div class="form-group mb-3">
        <label for="newBrandName">to this new vehicle brand</label>
        <input
          type="text"
          class="form-control"
          id="newBrandName"
          [(ngModel)]="updateFormVehicle.newBrandName"
          name="newBrandName"
          required
        />
      </div>

      <div class="form-group mb-3">
        <label for="vehicleIcon">Vehicle Icon</label>

        <!-- Image Preview -->
        <div *ngIf="updateFormVehicle.icon" class="image-preview mb-2">
          <img
            [src]="updateFormVehicle.icon"
            alt="Vehicle Icon Preview"
            style="max-width: 100%; max-height: 150px;"
          />
        </div>

        <!-- Drag-and-Drop Area -->
        <div
          class="drag-drop-area"
          (dragover)="onDragOver($event)"
          (dragleave)="onDragLeave($event)"
          (drop)="onDrop($event, 'updateFormVehicle')"
          (click)="fileInput.click()"
          style="border: 2px dashed #ccc; padding: 20px; text-align: center; cursor: pointer;"
        >
          <p>Drag and drop an image here or click to browse and choose.</p>
        </div>

        <!-- Hidden File Input -->
        <input
          type="file"
          accept="image/*"
          style="display: none"
          #fileInput
          (change)="onIconChange($event, 'updateFormVehicle')"
        />
      </div>
      <!-- Submit and Cancel Buttons -->
      <div class="d-flex justify-content-between mt-4">
        <button type="submit" class="btn btn-primary buttonForm w-25">Submit</button>
        <button type="button" (click)="cancelUpdateForm()" class="btn btn-danger buttonForm w-25">Cancel</button>
      </div>

      </form>
  </div>
</ng-container>

<div class="container d-flex align-items-center mt-3" *ngIf="formIsClosed&&updateFormIsClosed">
        <button type="button" class="btn btn-primary btn-sm p-2 m-2 w-25" routerLink="/admin/dashboard">Back</button>
        <button type="button" class="btn btn-primary btn-sm p-2 m-2 w-25" (click)="openForm()">Add</button>
    </div>
</body>
