<section class="intro">
  <h2 class="text-center my-3">Country Overview</h2>
  <div class="bg-image h-100" >
    <div class="mask d-flex align-items-center h-100">
      <div class="container">
        <div class="row justify-content-evenly text-center">
          <div class="col-4" >
            <form #countryForm="ngForm">
              <div class="form-group mb-3">
                <label for="name">Country Name</label>
                <input type="text" id="name" class="form-control" name="name" required [ngModel]="country?.name" />
              </div>
              <button *ngIf="!editMode" [disabled]="countryForm.invalid" (click)="CreateCountry()" class="btn btn-outline-light btn-secondary my-3" type="submit">Add Country</button>
              <button *ngIf="editMode" (click)="EditCountry()" class="btn btn-outline-light btn-secondary my-3" >Update</button>
              <button *ngIf="editMode" (click)="CancelCountryEdit()" class="btn btn-outline-light btn-secondary my-3 mx-2" >Cancel</button>
            </form>
          </div>

          <div class="col-5">
            <div class="row mb-2">
              <div class="col-10">
                <input class="form-control" (keyup)="onCountryNameSearch()" [(ngModel)]="countryNameSearch" placeholder="Search country">
              </div>
            </div>
            <div class="card">
              <div class="card-body p-0">
                <div class="table-responsive table-scroll" data-mdb-perfect-scrollbar="true"
                     style="position: relative">
                  <table class="table table-striped mb-0">
                    <thead>
                    <tr>
                      <th>Id</th>
                      <th>Name</th>
                      <th>Actions</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr *ngFor="let country of countries.dataItems; let i=index">
                      <td>{{country.id}}</td>
                      <td>{{ country.name }}</td>
                      <td><button class="btn btn-outline-light mx-1" [value]="i" (click)="LoadCountry($event)" >Edit</button>
                        <button class="btn btn-outline-danger mx-1" [value]="country.id" (click)="openMyConfirmDialog($event)">Delete</button></td>
                    </tr>
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          <div  class="d-flex justify-content-center mt-3">
            <pagination
              [boundaryLinks]="true"
              [totalItems]="countries.pagination!.totalCount"
              [itemsPerPage]="countries.pagination!.pageSize"
              [maxSize]="10"
              (pageChanged)="pageChanged($event)"
              previousText="&lsaquo;"
              nextText="&rsaquo;"
              firstText="&laquo;"
              lastText="&raquo;">
            </pagination>
          </div>
          </div>
        </div>

      </div>
    </div>
  </div>
</section>
