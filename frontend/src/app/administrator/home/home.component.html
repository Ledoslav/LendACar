<body>
<!-- Main Content -->
<div class="container-fluid mt-3">
  <div class="row">
    <!-- Main Dashboard -->
    <main class="col-12">
      <div class="d-flex justify-content-evenly mt-3">

        <mat-card class="app-users-card">
          <mat-card-header class="app-users-card-header">
            <div mat-card-avatar class="app-users-icon">
              <mat-icon aria-hidden="false" aria-label="Example home icon" fontIcon="groups"></mat-icon>
            </div>
          </mat-card-header>
          <mat-card-content class="app-users-card-content">
            <p class="app-users-label">App users:</p>
            <p class="app-users-count">{{dashboardData.userCount}}</p>
          </mat-card-content>
        </mat-card>

          <mat-card class="app-users-card">
            <mat-card-header class="app-users-card-header">
              <div mat-card-avatar class="app-users-icon">
                <mat-icon aria-hidden="false" aria-label="Example home icon" fontIcon="directions_car"></mat-icon>
              </div>
            </mat-card-header>
            <mat-card-content class="app-users-card-content">
              <p class="app-users-label">Vehicles:</p>
              <p class="app-users-count">{{ dashboardData.vehicleCount}}</p>
            </mat-card-content>
          </mat-card>

          <mat-card class="app-users-card">
            <mat-card-header class="app-users-card-header">
              <div mat-card-avatar class="app-users-icon">
                <mat-icon aria-hidden="false" aria-label="Example home icon" fontIcon="business_center"></mat-icon>
              </div>
            </mat-card-header>
            <mat-card-content class="app-users-card-content">
              <p class="app-users-label">Employees:</p>
              <p class="app-users-count">{{ dashboardData.employeeCount }}</p>
            </mat-card-content>
          </mat-card>

      </div>
    </main>
  </div>
  <div class="chart-container mx-auto my-4" style="max-width: 700px;">
    <h3>Number of registered users per month for current year</h3>
    <canvas id="myLineChart"></canvas>
  </div>
</div>

<!-- Footer -->
<footer class="bg-dark text-white py-3 mt-4">
  <div class="container d-flex align-items-center">
    <span>&copy; 2024 Lend A Car</span>
    <ul class="list-inline mb-0 p-3">
      <li class="list-inline-item"><a href="#" class="text-white">Policies</a></li>
      <li class="list-inline-item"><a href="#" class="text-white">Support</a></li>
      <li class="list-inline-item"><a href="#" class="text-white">Contact</a></li>
    </ul>
  </div>
</footer>
</body>
