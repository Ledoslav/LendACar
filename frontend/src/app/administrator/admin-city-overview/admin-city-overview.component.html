<section class="intro">
  <h2 class="text-center my-3">City Overview</h2>
  <div class="bg-image h-100" >
    <div class="mask d-flex align-items-center h-100">
      <div class="container">
        <div class="row justify-content-evenly text-center">
          <div class="col-5" >
            <form #cityForm="ngForm">
              <div class="form-group mb-3">
                <label for="name">City Name</label>
                <input type="text" id="name" class="form-control" name="name" required [ngModel]="city?.name" />
              </div>
              <div class="form-group mb-3">
                <label for="country">Country </label>
                <select class="form-select" aria-label="Default select example" required name="countryId"  [ngModel]="city?.countryId">
                    <option *ngFor="let country of countries"  id="country"  value="{{country.id}}" >{{country.name}}</option>
                </select>
              </div>
              <button *ngIf="!editMode" (click)="CreateCity()" [disabled]="cityForm.invalid || cityForm.controls['countryId'].value==0" class="btn btn-outline-light btn-secondary my-3" type="submit">Add City</button>
              <button *ngIf="editMode" (click)="UpdateCity()"  [disabled]="cityForm.invalid || cityForm.controls['countryId'].value==0" class="btn btn-outline-light btn-secondary my-3" type="submit">Update City</button>
              <button *ngIf="editMode" (click)="CancelCountryEdit()" class="btn btn-outline-light btn-secondary my-3 mx-2" >Cancel</button>
            </form>
          </div>

          <div class="col-5">
            <div class="row mb-2">
              <div class="col-5">
                <input class="form-control" (keyup)="onCityNameSearch()" [(ngModel)]="cityNameSearch" placeholder="Search city">
              </div>
              <div class="col-5">
                <select class="form-select" aria-label="Default select example" name="countryId" (change)="onCountryChange($event)" >
                    <option *ngFor="let country of countries" value="{{country.id}}">{{country.name}}</option>
                </select>
              </div>
            </div>
            <div class="card">
              <div class="card-body p-0">
                <div class="table-responsive table-scroll" data-mdb-perfect-scrollbar="true"
                     style="position: relative">
                  <table class="table table-striped mb-0">
                    <thead>
                    <tr>
                      <th>Id</th>
                      <th>Name</th>
                      <th>Country</th>
                      <th>Actions</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr *ngFor="let city of cities.dataItems; let i=index">
                      <td>{{city.id}}</td>
                      <td>{{ city.name }}</td>
                      <td>{{ city.country.name }}</td>
                      <td><button class="btn btn-outline-light mx-1" [value]="i" (click)="LoadCity($event)">Edit</button>
                        <button class="btn btn-outline-danger mx-1" [value]="city.id" (click)="openMyConfirmDialog($event)">Delete</button></td>
                    </tr>
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
            <div *ngIf="cities.pagination && cities.pagination.totalCount>pageSize" class="d-flex justify-content-center mt-3">
              <pagination
                [boundaryLinks]="true"
                [totalItems]="cities.pagination!.totalCount"
                [itemsPerPage]="cities.pagination!.pageSize"
                [maxSize]="10"
                (pageChanged)="pageChanged($event)"
                previousText="&lsaquo;"
                nextText="&rsaquo;"
                firstText="&laquo;"
                lastText="&raquo;">
              </pagination>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>
</section>
