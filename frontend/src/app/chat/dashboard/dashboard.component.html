<div class="chat-wrapper">
  <!-- Sidebar -->
  <div class="chat-sidebar">
    <div class="sidebar-header">Chats</div>
    <ul class="chat-list">
      <li class="chat-item">
        <img src="assets/profile1.jpg" alt="User">
        <div class="chat-details">
          <div class="chat-name">John Doe</div>
          <div class="chat-last-message">Hey, how’s it going?</div>
        </div>
        <div class="chat-time">10:30 AM</div>
      </li>
      <li class="chat-item">
        <img src="assets/profile2.jpg" alt="User">
        <div class="chat-details">
          <div class="chat-name">Jane Smith</div>
          <div class="chat-last-message">Let’s meet up later.</div>
        </div>
        <div class="chat-time">9:45 AM</div>
      </li>
      <li class="chat-item">
        <img src="assets/profile3.jpg" alt="User">
        <div class="chat-details">
          <div class="chat-name">Alex Johnson</div>
          <div class="chat-last-message">Sent you the files.</div>
        </div>
        <div class="chat-time">Yesterday</div>
      </li>
    </ul>
  </div>

  <!-- Chat Container -->
  <div class="chat-container">
    <div class="chat-header">Chat</div>
    <div class="chat-body">
      <div class="message received">Hello! How can I help you?</div>
      <div class="message sent">Hi! I need some assistance.</div>
    </div>
    <div class="chat-footer">
      <input type="text" placeholder="Type a message...">
      <button>Send</button>
    </div>
  </div>
</div>
