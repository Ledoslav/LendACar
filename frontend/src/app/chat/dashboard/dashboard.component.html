<app-navbar></app-navbar>
<div class="{{this.mode}} chat-wrapper">

  <!-- Sidebar -->
  <div class="chat-sidebar">
    <div class="sidebar-header">{{'CHATS.CHATS' | translate}}</div>
    <ul class="chat-list">
      <li
        class="chat-item"
        *ngFor="let chat of chats"
        [class.active]="chat === selectedChat"
        (click)="selectChat(chat)"
      >
        <img [src]="chat.avatar" alt="User">
        <div class="chat-details">
          <div class="chat-name">{{ chat.name }}</div>
          <div class="chat-last-message">{{ chat.lastMessage }}</div>
        </div>
        <div class="chat-time">{{ chat.time}}</div>
        <button (click)="deleteChat(chat)" class="delete-button">X</button>
      </li>
    </ul>
  </div>

  <!-- Chat Container -->
  <div class="chat-container" *ngIf="selectedChat">

    <!-- Vehicle Banner -->
    <div class="vehicle-banner" (click)="RouteToListing(selectedChat.vehicleId)">
      Reserved Vehicle: <span>{{ selectedChat.vehicle }}</span>
    </div>

    <div class="chat-header">{{ selectedChat.name }}</div>
    <div class="chat-body">
      <div
        *ngFor="let message of selectedChat.messages"
        class="message"
        [ngClass]="{ 'sent': message.sender === 'me', 'received': message.sender === 'them' }"
      >
        {{ message.text }}
      </div>
    </div>
    <div class="chat-footer">
      <input
        type="text"
        placeholder="Type a message..."
        [(ngModel)]="newMessage"
        (keyup.enter)="sendMessage()"
      >
      <button (click)="sendMessage()">{{'CHATS.SEND' | translate}}</button>
    </div>
  </div>


  <!-- If no chat is selected -->
  <div class="chat-container" *ngIf="!selectedChat">
    <div class="chat-header">{{'CHATS.SELECT_CHAT' | translate}}</div>
    <div *ngIf="chats.length === 0" class="no-chats">
      {{'CHATS.NO_CHATS' | translate}}
    </div>
  </div>
</div>
