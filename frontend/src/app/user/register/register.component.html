<div class="container mt-4" id="stepperContainer">
  <mat-stepper linear #stepper>
    <mat-step label="Personal Information" [stepControl]="personalInfo" >
      <div class="container mt-4">
        <h3 class="text-center mb-2">Personal Information</h3>
        <form [formGroup]="personalInfo">

          <div class="form-group mb-2">
            <label for="firstName">First Name</label>
            <input type="text" id="firstName" class="form-control" formControlName="firstName" >
            <mat-error *ngIf="personalInfo.get('firstName')?.invalid && personalInfo.get('firstName')?.touched" style="color: red">
              First name required </mat-error>
          </div>

          <div class="form-group mb-2">
            <label for="lastName">Last Name</label>
            <input formControlName="lastName" id="lastName" type="text"  class="form-control" >
            <mat-error *ngIf="personalInfo.get('lastName')?.invalid && personalInfo.get('lastName')?.touched" style="color: red">
              Last name required
            </mat-error>
          </div>


          <div class="form-group mb-2">
            <label for="lastName">Username</label>
            <input formControlName="username" id="username" type="text"  class="form-control" >
            <mat-error *ngIf="personalInfo.get('username')?.invalid && personalInfo.get('username')?.touched" style="color: red">
              Last name required
            </mat-error>
          </div>

          <div class="form-group mb-2">
            <label for="birthDate">Birth date</label>
            <input formControlName="birthDate" id="birthDate" type="date" class="form-control" >
            <mat-error *ngIf="personalInfo.get('birthDate')?.invalid && personalInfo.get('birthDate')?.touched" style="color: red">
              Birth date required
            </mat-error>
          </div>

          <div class="d-flex justify-content-end">
          <button class="btn btn-outline-light mt-2" matStepperNext type="button">Next</button>
          </div>
        </form>
      </div>
    </mat-step>

    <mat-step  label="Contact Details"  [stepControl]="contactDetails">
      <form [formGroup]="contactDetails">
        <div class="container mt-4">
          <h3 class="text-center mb-2">Contact Details</h3>
        <div class="form-group mb-2">
          <label for="firstName">Email Address</label>
          <input type="text" id="emailAddress" class="form-control" formControlName="emailAdress" placeholder="lendacar@gmail.com">
          <mat-error *ngIf="contactDetails.get('emailAdress')?.invalid"></mat-error>
        </div>

        <div class="form-group mb-2">
          <label for="firstName">Phone number</label>
          <input type="text" id="phoneNumber" class="form-control" formControlName="phoneNumber" placeholder="+38761888999">
          <mat-error *ngIf="contactDetails.get('phoneNumber')?.invalid"></mat-error>
        </div>

          <div class="d-flex justify-content-between">
            <button class="btn btn-outline-light mt-2" matStepperPrevious type="button">Back</button>
            <button class="btn btn-outline-light mt-2" matStepperNext type="button">Next</button>
          </div>
        </div>

      </form>
    </mat-step>

    <mat-step  label="Address"  [stepControl]="address">
      <form [formGroup]="address">
        <div class="container mt-4">
          <h3 class="text-center mb-2">Address</h3>
          <div class="form-group mb-2">
            <label for="country">Country</label>
            <select  class="form-select" (change)="FilterCities($event)" aria-label="Default select example" formControlName="countryId" >
              <option *ngFor="let country of countries"  id="country" value="{{country.id}}">{{country.name}}</option>
            </select>
          </div>

          <div class="form-group mb-2">
            <label for="city">City</label>
            <select  class="form-select" aria-label="Default select example" formControlName="cityId" >
              <option *ngFor="let city of filteredCities"  id="city" value="{{city.id}}">{{city.name}}</option>
            </select>
          </div>
          <div class="d-flex justify-content-between">
            <button class="btn btn-outline-light mt-2" matStepperPrevious type="button">Back</button>
            <button class="btn btn-outline-light mt-2" matStepperNext type="button">Next</button>
          </div>
        </div>

      </form>
    </mat-step>

    <mat-step  label="Password"  [stepControl]="passwords">
      <div class="container mt-4">
        <h3 class="text-center mb-2">Password</h3>
        <form [formGroup]="passwords">

          <div class="form-group mb-2">
            <label for="password">Password</label>
            <input [type]="passwordShow ? 'text': 'password'" (change)="UpdateRepeatPasswordValidity()" id="password" class="form-control" formControlName="password" required>
            <mat-error *ngIf="passwords.get('password')?.invalid"></mat-error>
          </div>


          <div class="form-group mb-2">
            <label for="repeatPassword">Repeat password</label>
            <input [type]="passwordShow ? 'text': 'password'" id="repeatPassword" class="form-control" formControlName="repeatPassword" required>
            <mat-error *ngIf="passwords.get('repeatPassword')?.invalid"></mat-error>
          </div>


        </form>
        <div class="d-flex justify-content-begin">
          <input [(ngModel)]="passwordShow" type="checkbox" id="check" name="showPassword"/>
          <label class="form-label px-2" for="check">Show password</label>
        </div>
        <div class="d-flex justify-content-between">
          <button class="btn btn-outline-light mt-2" matStepperPrevious type="button">Back</button>
          <button class="btn btn-outline-light mt-2" matStepperNext type="button">Next</button>
        </div>
      </div>
    </mat-step>

    <mat-step>
      <ng-template matStepLabel>Done</ng-template>
      <div class="container">
        <div class="d-flex justify-content-center">
          <h2>You are now done.</h2>
        </div>
        <div class="d-flex justify-content-between mt-2">
          <button class="btn btn-outline-light"  matStepperPrevious>Back</button>
          <button class="btn btn-outline-light" (click)="register()">Finish</button>
        </div>
      </div>
    </mat-step>
  </mat-stepper>
</div>
