<h2 class="mb-2 text-center">{{ 'PROFILE.PHOTO.PHOTO' | translate }}</h2>
<hr>
<div class="container">
  <ng-container *ngIf="accountService.currentUser()?.profilePhotoUrl==null">
  <h2>{{ 'PROFILE.PHOTO.UPLOAD_TITLE' | translate }}</h2>
    <div *ngIf="!showCropper" class="drag-drop-area" (dragover)="onDragOver($event)" (drop)="onDrop($event)">
      <p>{{ 'PROFILE.PHOTO.DRAG_DROP' | translate }}</p>
      <input type="file" accept="image/*" #fileInput (change)="onFileChange($event)" hidden />
      <button (click)="fileInput.click()">{{ 'PROFILE.PHOTO.CHOOSE_FILE' | translate }}</button>
    </div>
  </ng-container>

  <div *ngIf="showCropper" class="cropper-modal" style="position: relative;">
    <image-cropper
      [imageChangedEvent]="imageChangedEvent"
      [maintainAspectRatio]="true"
      [aspectRatio]="1 / 1"
      [roundCropper]="true"
      [cropperStaticWidth]="250"
      [cropperStaticHeight]="250"
      [resizeToWidth]="400"
      [resizeToHeight]="400"
      [imageQuality]="100"
      format="jpeg"
      (imageCropped)="imageCropped($event)"
      (imageLoaded)="imageLoaded($event)"
      (cropperReady)="cropperReady()"
      (loadImageFailed)="loadImageFailed()"
    ></image-cropper>

    <div class="mt-2">
      <button class="btn btn-outline-light " (click)="uploadCroppedImage()">{{ 'PROFILE.PHOTO.UPLOAD' | translate }}</button>
      <button class="btn btn-outline-light mx-2" (click)="cancelCrop()">{{ 'PROFILE.PHOTO.CANCEL' | translate }}</button>
    </div>
  </div>


  <ng-container *ngIf="!showCropper && accountService.currentUser()?.profilePhotoUrl!=null">
    <h2>{{ 'PROFILE.PHOTO.EDIT_TITLE' | translate }}</h2>
    <div class="d-flex justify-content-center mb-3">
      <div class="profile-pic">
        <img *ngIf="accountService.currentUser()?.profilePhotoUrl!=null" [src]="accountService.currentUser()?.profilePhotoUrl" alt="Profile pic">
      </div>
    </div>
    <div class="d-flex justify-content-center mb-3">
      <div class="mt-2">
        <input type="file" accept="image/*" #fileInput (change)="onFileChange($event)" hidden />
        <button class="btn btn-outline-light" (click)="fileInput.click()">{{ 'PROFILE.PHOTO.CHANGE' | translate }}</button>
        <button class="btn btn-outline-danger mx-2" style="color: red" (click)="removeProfilePhoto()">{{ 'PROFILE.PHOTO.REMOVE' | translate }}</button>
      </div>
    </div>
  </ng-container>

  <div *ngIf="isLoading" class="loader-overlay">
    <mat-progress-spinner mode="indeterminate" color="accent"></mat-progress-spinner>
  </div>

</div>
