<div class="poll-container">
  <div class="poll-card" *ngFor="let poll of polls; trackBy: trackByIndex">
    <h3 style="text-align: left;">{{ poll.question }}</h3>
    <ul>
      <li *ngFor="let option of poll.options">
        <button
          (click)="castVote(poll.id, option.option)"
          [style.background]="'linear-gradient(to right, #353A40 ' + option.percentage + '%, #545B62 ' + option.percentage + '%)'"
        >
          {{ option.option }} ({{ option.percentage ? (option.percentage | number: '1.0-2') : 0 }}%)
        </button>
      </li>
    </ul>
  </div>
