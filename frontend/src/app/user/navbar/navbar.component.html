<div class="navbar-page">
  <img class="vector" src="Vector.png" />
  <div class="side-bar">
    <div class="menu-item" routerLinkActive="active" routerLink="/public/home" ><img src="Home.svg" alt="Home"> <span>{{'SIDEBAR.HOME' | translate}}</span></div>
    <div class="menu-item"><img src="Bell.svg" alt="Activity"> <span>{{'SIDEBAR.ACTIVITY' | translate}}</span></div>
    <div class="menu-item"><img src="Messagesquare.svg" alt="Chats"> <span>{{'SIDEBAR.CHATS' | translate}}</span></div>
    <div class="separator"><img src="Minus.svg" alt="Separator"></div>
    <div class="menu-item"><img src="Bookmark.svg" alt="Saved"> <span>{{'SIDEBAR.SAVED' | translate}}</span></div>
    <div class="menu-item"><img src="Key.svg" alt="Reserved"> <span>{{'SIDEBAR.RESERVED' | translate}}</span></div>
    <div class="separator"><img src="Minus.svg" alt="Separator"></div>
    <div routerLinkActive="active" routerLink="/user/profile/my-vehicles" class="menu-item"><img src="Truck.svg" alt="My Vehicles"> <span>{{'SIDEBAR.MY_VEHICLES' | translate}}</span></div>
    <div class="separator"><img src="Minus.svg" alt="Separator"></div>
    <div class="menu-item" routerLink="/company/dashboard"><img src="Plussquare.svg" alt="Create Company"> <span>{{'SIDEBAR.CREATE_COMPANY' | translate}}</span></div>
  </div>

    <div class="nav-bar">
      <div class="nav-left">
        <div class="logo"><img src="LAC_logo.png" alt="Logo"></div>
        <language-selector></language-selector>
      </div>
      <div class="right-section" routerLink="/user/profile" style="cursor: pointer;">
        <span class="text-wrapper-17">{{ accountService.currentUser()?.username }}</span>
        <img *ngIf="accountService.currentUser()?.profilePhotoUrl!=null" class="profile-icon" style="border-radius: 20px" [src]="accountService.currentUser()?.profilePhotoUrl" alt="Profile">
        <img *ngIf="accountService.currentUser()?.profilePhotoUrl==null" class="profile-icon" style="border-radius: 20px" src="/defaultProfilePic.png" alt="Profile">
      </div>
    </div>

  <div class="content">
    <router-outlet></router-outlet>
  </div>


</div>
