<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.13.1/css/all.min.css" integrity="sha256-2XFplPlrFClt0bIdPgpz8H7ojnk10H69xRqd9+uTShA=" crossorigin="anonymous" />

<div class="container">
  <div class="row">
    <div class="col-12">
      <!-- Page title -->
      <div class="my-5">
        <h3>My Profile</h3>
        <hr>
      </div>
      <!-- Form START -->
      <form [formGroup]="userEditForm" (ngSubmit)="Update()" class="file-upload">
        <div class="row mb-5 gx-5">
          <!-- Contact detail -->
          <div class="col-xxl-8 mb-5 mb-xxl-0">
            <div class="bg-secondary-soft px-4 py-5 rounded">
              <div class="row g-3">
                <h4 class="mb-4 mt-0">Contact detail</h4>
                <!-- First Name -->
                <div class="col-md-6">
                  <label class="form-label">First Name *</label>
                  <input type="text" class="form-control" name="firstName" aria-label="First name"
                   formControlName="firstName">
                </div>
                <!-- Last name -->
                <div class="col-md-6">
                  <label class="form-label">Last Name *</label>
                  <input type="text" class="form-control" name="lastName" aria-label="Last name"
                         formControlName="lastName">
                </div>
                <!-- Phone number -->
                <div class="col-md-6">
                  <label class="form-label">Phone number *</label>
                  <input type="text" class="form-control" name="phoneNumber" aria-label="Phone number"
                         formControlName="phoneNumber" >
                </div>
                <!-- Mobile number -->
                <div class="col-md-6">
                  <label class="form-label">Birth date *</label>
                  <input type="text"
                         class="form-control bg-secondary" name="birthDate" aria-label="Phone number" readonly
                         formControlName="birthDate">
                </div>
                <div class="col-md-6">
                  <label for="country">Country</label>
                  <select class="form-select"  aria-label="Default select example" formControlName="countryId" >
                    <option *ngFor="let country of countries"   id="country" value="{{country.id}}">{{country.name}}</option>
                  </select>
                </div>

                <div class="col-md-6">
                  <label for="city">City</label>
                  <select  class="form-select" aria-label="Default select example" formControlName="cityId" >
                    <option *ngFor="let city of filteredCities"  id="city" value="{{city.id}}">{{city.name}}</option>
                  </select>
                </div>

                <!-- Email -->
                <div class="col-md-6">
                  <label for="inputEmail4" class="form-label">Email *</label>
                  <input type="email" readonly  class="form-control bg-secondary" name="emailAddress" id="inputEmail4"
                         formControlName="emailAddress">
                </div>
                <!-- Username -->
                <div class="col-md-6">
                  <label class="form-label">Username *</label>
                  <input type="text" readonly  class="form-control bg-secondary" name="username" aria-label="Phone number"
                         formControlName="username">
                </div>
              </div> <!-- Row END -->
            </div>
          </div>
          <!-- Upload profile -->
          <div class="col-xxl-4">
            <div class="bg-secondary-soft px-4 py-5 rounded">
              <div class="row g-3">
                <h4 class="mb-4 mt-0">Upload your profile photo</h4>
                <div class="text-center">
                  <!-- Image upload -->
                  <div class="square position-relative display-2 mb-3">
                    <i class="fas fa-fw fa-user position-absolute top-50 start-50 translate-middle text-secondary"></i>
                  </div>
                  <!-- Button -->
                  <input type="file" id="customFile" name="file" hidden="">
                  <label class="btn btn-success-soft btn-block" for="customFile">Upload</label>
                  <button type="button" class="btn btn-danger-soft">Remove</button>
                  <!-- Content -->
                  <p class="text-muted mt-3 mb-0"><span class="me-1">Note:</span>Minimum size 300px x 300px</p>
                </div>
              </div>
            </div>
          </div>
        </div> <!-- Row END -->

        <!-- button -->
        <div class="gap-3 d-md-flex justify-content-md-end text-center gap-3">
          <div >
            <button type="button" class="btn btn-primary" routerLink="/user/userProfile">Back</button>
          </div>
          <button type="button" class="btn btn-danger btn-lg" (click)="Delete()">Delete profile</button>
          <button type="submit" class="btn btn-primary btn-lg">Update profile</button>
        </div>
      </form> <!-- Form END -->

      <!-- change password -->
      <form [formGroup]="changePasswordForm" (ngSubmit)="ChangePassword()">
        <div class="col-xxl-6">
          <div class="bg-secondary-soft px-4 py-5 rounded">
            <div class="row g-3">
              <h4 class="my-4">Change Password</h4>
              <!-- Old password -->
              <div class="col-md-6">
                <label for="exampleInputPassword1" class="form-label">Current password *</label>
                <input [type]="changePasswordForm.get('passwordShow')?.value ? 'text': 'password'" class="form-control" id="exampleInputPassword1"
                       formControlName="currentPassword" name="currentpassword">
              </div>
              <!-- New password -->
              <div class="col-md-6">
                <label for="exampleInputPassword2" class="form-label">New password *</label>
                <input [type]="changePasswordForm.get('passwordShow')?.value ? 'text': 'password'"  class="form-control" id="exampleInputPassword2"
                      formControlName="newPassword" name="newpassword">
              </div>
              <!-- Confirm password -->
              <div class="col-md-12">
                <label for="exampleInputPassword3" class="form-label">Confirm Password *</label>
                <input [type]="changePasswordForm.get('passwordShow')?.value ? 'text': 'password'" class="form-control" id="exampleInputPassword3"
                       name="repeatPassword" formControlName="repeatPassword">

                <div class="d-flex" *ngIf="changePasswordForm.get('repeatPassword')?.invalid && changePasswordForm.get('repeatPassword')?.touched">
                  <span style="color: red;" class="text-danger">Passwords don't match</span>
                </div>

                <input formControlName="passwordShow" type="checkbox" id="check" name="check"/>
                <label class="form-label px-2" for="check">Show password</label>
              </div>
            </div>
            <button type="submit" class="btn btn-primary btn-lg mt-5" [disabled]="changePasswordForm.invalid">Change password</button>
          </div>
        </div>
      </form>

    </div>
  </div>
</div>
