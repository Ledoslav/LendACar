<div class="dashboard-container">
    <!-- User Info Card -->
    <div class="user-info-card">
      <div class="user-avatar">
        <img 
        [src]="user?.profilePhotoUrl || 'BlankAvatar.png'" 
        alt="{{ user?.username }}" 
        class="avatar-image">
      </div>
      <div class="user-details">
        <h3>{{ user?.username }}</h3>
        <p>{{ user?.city?.name }}</p>
        <p>{{ user?.emailAddress }}</p>
        <p>{{ user?.averageRating }} stars</p>
      </div>
      <button class="upload-button" [routerLink]="['/user/vehicleUpload']" [disabled]="!user?.isVerified">
      Upload Vehicle
    </button>

    </div>

    <!-- Vehicle List Card -->
    <div class="vehicle-list-card" style="max-width: 800px;">
      <div class="search-bar">
        <input type="text" placeholder="Search by vehicle title..." [(ngModel)]="searchText" style="width: 80%;"/>
        <select [(ngModel)]="availabilityFilter">
          <option value="all">All</option>
          <option value="available">Available</option>
          <option value="unavailable">Unavailable</option>
        </select>
      </div>

      <div *ngIf="!user?.isVerified" class="verification-message">
        <p>Unverified users cannot upload vehicles</p>
      </div>

      <div *ngIf="user?.isVerified && vehicles?.length === 0" class="no-vehicles-message">
        <p>You don't have any uploaded vehicles</p>
      </div>

      <div class="vehicle-cards" *ngIf="user?.isVerified && vehicles">
        <div *ngFor="let vehicle of filteredVehicles" class="vehicle-card" >
          <div class="vehicle-image">
            <button (click)="changeImage(vehicle, -1)">&#10094;</button>
            <img [src]="getCurrentImage(vehicle)" alt="{{ vehicle.title }}">
            <button (click)="changeImage(vehicle, 1)">&#10095;</button>
          </div>
          <h4>{{ vehicle.title }}</h4>
          <p class="availability">
            <img [src]="vehicle.avaliable ? 'marks/checkmark.png' : 'marks/xmark.png'" alt="status" width="5%" height="5%" />
            {{ vehicle.avaliable ? 'Available' : 'Unavailable' }}
          </p>
          <button class="listing-button" (click)="goToVehicle(vehicle.id)">Go to listing</button>
        </div>
      </div>
    </div>
  </div>
