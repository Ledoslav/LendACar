<h2 class="mb-2 text-center">Photo</h2>
<hr>
<div class="container">
  <ng-container *ngIf="employeeService.currentEmployee()?.profilePhotoUrl==null">
    <h2>Upload Profile Picture</h2>
    <div *ngIf="!showCropper" class="drag-drop-area" (dragover)="onDragOver($event)" (drop)="onDrop($event)">
      <p>Drag & drop an image here or click to browse.</p>
      <input type="file" accept="image/*" #fileInput (change)="onFileChange($event)" hidden />
      <button (click)="fileInput.click()">Choose File</button>
    </div>
  </ng-container>

  <div *ngIf="showCropper" class="cropper-modal">
    <image-cropper
      [imageChangedEvent]="imageChangedEvent"
      [maintainAspectRatio]="true"
      [aspectRatio]="1 / 1"
      [roundCropper]="true"
      [cropperStaticWidth]="250"
      [cropperStaticHeight]="250"
      [resizeToWidth]="400"
      [resizeToHeight]="400"
      [imageQuality]="0.8"
      format="jpeg"
      (imageCropped)="imageCropped($event)"
      (imageLoaded)="imageLoaded($event)"
      (cropperReady)="cropperReady()"
      (loadImageFailed)="loadImageFailed()"
    ></image-cropper>

    <div class="mt-2">
      <button class="btn btn-outline-light " (click)="uploadCroppedImage()">Upload</button>
      <button class="btn btn-outline-light mx-2" (click)="cancelCrop()">Cancel</button>
    </div>
  </div>


  <ng-container *ngIf="!showCropper && employeeService.currentEmployee()?.profilePhotoUrl!=null">
    <h2>Edit Profile Picture</h2>
    <div class="d-flex justify-content-center mb-3">
      <div class="profile-pic">
        <img *ngIf="employeeService.currentEmployee()?.profilePhotoUrl!=null" [src]="employeeService.currentEmployee()?.profilePhotoUrl" alt="Profile pic">
      </div>
    </div>
    <div class="d-flex justify-content-center mb-3">
      <div class="mt-2">
        <input type="file" accept="image/*" #fileInput (change)="onFileChange($event)" hidden />
        <button class="btn btn-outline-light" (click)="fileInput.click()">Change</button>
        <button class="btn btn-outline-danger mx-2" style="color: red" (click)="removeProfilePhoto()">Remove</button>
      </div>
    </div>
  </ng-container>

</div>

<div *ngIf="isLoading" class="loader-overlay">
  <mat-progress-spinner mode="indeterminate" color="accent"></mat-progress-spinner>
</div>
