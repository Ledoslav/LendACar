<div class="col-md-11 my-3">
  <div class="d-flex justify-content-center">
    <!-- Profile Sidebar (Card) -->
    <div class="col-md-3">
      <div class="card shadow-sm">
        <div class="card-body menu">
          <div class="d-flex justify-content-center mb-3">
            <div class="profile-pic">
              <img *ngIf="employeeService.currentEmployee()?.profilePhotoUrl==null"  src="/defaultProfilePic.png" alt="Profile pic">
              <img *ngIf="employeeService.currentEmployee()?.profilePhotoUrl!=null" [src]="employeeService.currentEmployee()?.profilePhotoUrl" alt="Profile pic">
            </div>
          </div>
          <h5 class="text-center mb-3">{{employeeService.currentEmployee()?.firstName}} {{employeeService.currentEmployee()?.lastName}}</h5>

          <ul class="list-group list-group-flush">
            <li class="list-group-item p-2 mb-2">
              <button class="btn w-100 text-center list-button" routerLink="overview" routerLinkActive="active-link">Profile</button>
            </li>
            <li class="list-group-item p-2 mb-2">
              <button class="btn w-100 text-center list-button"  routerLink="edit-photo" routerLinkActive="active-link" >Photo</button>
            </li>
            <li class="list-group-item p-2 mb-2">
              <button class="btn w-100 text-center list-button" routerLink="edit-account-security" routerLinkActive="active-link">Account Security</button>
            </li>
<!--            <li class="list-group-item p-2 mb-2">-->
<!--              <button class="btn w-100 text-center list-button" routerLink="verification-request" routerLinkActive="active-link">Verification Request</button>-->
<!--            </li>-->
          </ul>
          <div class="d-flex justify-content-center">
            <button class="btn w-75 mt-4 p-2"
                    style="border-radius: 50px;background-color: #ffffff; color: black" (click)="employeeService.Logout()">Log out</button>
          </div>

        </div>
      </div>
    </div>

    <!-- Profile Form -->
    <div class="col-md-7 ms-md-5">
      <div class="card shadow-sm">
        <div class="card-body">
          <router-outlet></router-outlet>
        </div>
      </div>
    </div>
  </div>
</div>
